! Core Router Gateway & Access Control Lists
! Author: GordoDHD
!

! Sub-interfaces for VLAN Routing
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.0.10.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.0.20.1 255.255.255.0
!

! Restrict Access: IoT Medical Devices isolated from Guest Wi-Fi
ip access-list extended BLOCK_GUEST_TO_BIOMED
 deny ip 10.0.40.0 0.0.0.255 10.0.10.0 0.0.0.255
 permit ip any any
