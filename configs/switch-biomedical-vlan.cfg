! Configuration for Hospital Floor Switch
! Author: Denris Hida
!

vlan 10
 name BIOMEDICAL_DEVICES
vlan 20
 name EHR_PATIENT_DATA
vlan 30
 name STAFF_WORKSTATIONS
vlan 40
 name GUEST_WIFI

! Secure Port Configuration for PACS/MRI Station
interface GigabitEthernet0/1
 description Connected to MRI Workstation
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown

! Secure Trunking to Core Router
interface GigabitEthernet0/24
 description Trunk link to Core Switch
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
